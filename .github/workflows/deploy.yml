name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.MAIN }}
      CLOUDFLARE_ACCOUNT_ID: 260d34f460ccbda0dd421a1d25a40d49
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # runs outside the repo so wrangler uploads dist/ as-is instead of auto-configuring the Vite project;
      # skipped until the MAIN secret (Cloudflare API token) exists, so the build still acts as CI
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: ${{ runner.temp }}
        run: npx wrangler@4 pages deploy "$GITHUB_WORKSPACE/dist" --project-name pepaniank --branch main --commit-hash "$GITHUB_SHA"
